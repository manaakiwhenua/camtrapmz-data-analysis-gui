[project]
name = "app"
version = "0.1.0"
description = "A python project for CamTrapNZ results' data analysis"
authors = [
    {name = "Libby Li"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pyqt5 (>=5.15.11,<6.0.0)",
    "xlsxwriter (>=3.2.8,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
camtrapnzanalyzer = "app.src.gui:launch_gui"
[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.15.0"
